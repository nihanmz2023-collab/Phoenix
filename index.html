<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Library</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: darkblue; }
    input { padding: 8px; width: 300px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
  </style>
</head>
<body>
  <h1>📚 My Library</h1>
  <input type="text" id="searchBar" placeholder="Search book by name...">

  <table id="bookTable">
    <thead>
      <tr>
        <th>Book Name</th>
        <th>Author</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Dracula</td><td>Bram Stoker</td></tr>
      <tr><td>Harry Potter and the Chamber of Secrets</td><td>J.K. Rowling</td></tr>
      <tr><td>Gitanjali</td><td>Rabindranath Tagore</td></tr>
      <tr><td>The Lord of the Rings</td><td>J.R.R. Tolkien</td></tr>
    </tbody>
  </table>

  <script>
    const searchBar = document.getElementById('searchBar');
    searchBar.addEventListener('keyup', function() {
      const filter = searchBar.value.toLowerCase();
      const rows = document.querySelectorAll('#bookTable tbody tr');
      rows.forEach(row => {
        const bookName = row.cells[0].textContent.toLowerCase();
        row.style.display = bookName.includes(filter) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
